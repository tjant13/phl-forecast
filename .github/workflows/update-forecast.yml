
name: Update Philadelphia Forecast

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests matplotlib scipy

      - name: Generate forecast charts
        run: python Multimodel_ShortTerm_Forecast_Tool2.py

      - name: Publish updated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plots/
          if ! git diff --cached --quiet; then
            git commit -m "Update forecast charts"
            git push
          fi
