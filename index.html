<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Philadelphia Area Forecasts</title>

  <style>
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .chart img {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (min-width: 651px) {
      .chart-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

  <h1>Philadelphia Area Forecasts</h1>

  <p style="color: #444444;">
    Multi-model weather guidance for the Philadelphia region
  </p>

  <h2>Regional Forecast Charts</h2>

  <section class="chart-grid">
    <div class="chart">
      <img src="plots/precip_forecast_chart_spline.png"
           alt="Precipitation forecast">
    </div>

    <div class="chart">
      <img src="plots/wind_gust_forecast_chart_spline.png"
           alt="Wind gust forecast">
    </div>

    <div class="chart">
      <img src="plots/cape_forecast_chart_spline.png"
           alt="Atmospheric instability forecast">
    </div>

    <div class="chart">
      <img src="plots/temperature_forecast_chart_spline.png"
           alt="Temperature forecast">
    </div>
  </section>

  <h2>Meteograms</h2>

  <section class="chart-grid">
    <div class="chart">
      <img src="plots/meteogram_precipitation.png"
           alt="Precipitation comparison between weather models">
    </div>

    <div class="chart">
      <img src="plots/meteogram_temperature.png"
           alt="Temperature comparison between weather models">
    </div>

    <div class="chart">
      <img src="plots/meteogram_wind.png"
           alt="Wind speed comparison between weather models">
    </div>

    <div class="chart">
      <img src="plots/meteogram_pressure.png"
           alt="Sea-level pressure comparison between weather models">
    </div>
  </section>

  <p style="color: #666666; font-size: 14px;">
    Forecast charts update automatically every three hours.
    Model guidance may differ and is subject to change.
  </p>

</body>
</html>
