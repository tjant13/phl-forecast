<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Philadelphia Area Forecasts</title>
  <style>
    body {
      margin: 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      background: white;
    }

    h1 {
      margin-bottom: 4px;
    }

    .subtitle {
      margin-top: 0;
      margin-bottom: 24px;
      color: #555;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .forecast-grid img {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 700px) {
      .forecast-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <h1>Philadelphia Area Forecasts</h1>
  <p class="subtitle">Multi-model forecast guidance for the Philadelphia area.</p>

  <div class="forecast-grid">
    <img src="plots/precip_forecast_chart_spline.png"
         alt="Precipitation forecast chart">
    <img src="plots/wind_gust_forecast_chart_spline.png"
         alt="Wind gust forecast chart">
    <img src="plots/cape_forecast_chart_spline.png"
         alt="CAPE forecast chart">
    <img src="plots/temperature_forecast_chart_spline.png"
         alt="Temperature forecast chart">
  </div>
</body>
</html>
